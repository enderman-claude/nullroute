name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux: build, run the core tests, start the real game under a virtual
  # display, and package a release folder.
  linux:
    name: linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build and display dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev \
            xvfb xauth

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - name: Start the game under a virtual display
        # The game runs until closed. A timeout (exit code 124) means it started
        # and kept running, which is the pass condition for a window program.
        run: |
          xvfb-run -a sh -c 'timeout 8 build/nullroute; code=$?; echo "exit code $code"; [ "$code" -eq 124 ]'

      - name: Package
        run: |
          mkdir -p dist/nullroute-linux-x86_64
          cp build/nullroute dist/nullroute-linux-x86_64/
          cp -R build/assets dist/nullroute-linux-x86_64/
          cp README.md LICENSE dist/nullroute-linux-x86_64/
          tar -czf dist/nullroute-linux-x86_64.tar.gz -C dist nullroute-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: nullroute-linux-x86_64
          path: dist/nullroute-linux-x86_64.tar.gz
          if-no-files-found: error

  # Windows: cross-compiled with MinGW-w64 on Linux, so the release binary is
  # built by a toolchain that runs in this job.
  windows:
    name: windows x86_64 (cross-compiled)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and zip
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zip

      - name: Configure and build
        run: |
          cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win --parallel

      - name: Package
        run: |
          mkdir -p dist/nullroute-windows-x86_64
          cp build-win/nullroute.exe dist/nullroute-windows-x86_64/
          cp -R build-win/assets dist/nullroute-windows-x86_64/
          cp README.md LICENSE dist/nullroute-windows-x86_64/
          (cd dist && zip -qr nullroute-windows-x86_64.zip nullroute-windows-x86_64)

      - uses: actions/upload-artifact@v4
        with:
          name: nullroute-windows-x86_64
          path: dist/nullroute-windows-x86_64.zip
          if-no-files-found: error

  # Publish both archives to a GitHub Release when a v* tag is pushed.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
