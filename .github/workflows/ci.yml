name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint and test the shell game under several POSIX shells on two OSes.
  # Ubuntu's /bin/sh is dash; macOS /bin/sh is bash in POSIX mode.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: sh
          - os: ubuntu-latest
            shell: bash --posix
          - os: ubuntu-latest
            shell: busybox sh
          - os: macos-latest
            shell: sh
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck busybox

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Lint
        if: matrix.shell == 'sh'
        run: make lint

      - name: Test
        env:
          NR_TEST_SHELL: ${{ matrix.shell }}
        run: sh tests/run.sh

  # Native launcher and Linux release archive.
  build-linux:
    name: build (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build launcher
        run: make launcher

      - name: Smoke test the launcher
        run: |
          build/nullroute -V
          printf 'scan\nexit\n' | build/nullroute -s "$RUNNER_TEMP/save" | grep -q "crumbco-pos"

      - name: Package
        run: sh tools/package.sh linux-x86_64 build/nullroute nullroute tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: nullroute-linux-x86_64
          path: dist/nullroute-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # Cross-compiled Windows launcher. The game itself runs under Git for
  # Windows or MSYS2 sh.exe, so the package does not bundle a shell.
  build-windows:
    name: build (windows x86_64)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 and zip
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            gcc-mingw-w64-x86-64 libc6-dev-amd64 zip

      - name: Build launcher
        run: make launcher-win

      - name: Package
        run: sh tools/package.sh windows-x86_64 build/nullroute.exe nullroute.exe zip

      - uses: actions/upload-artifact@v4
        with:
          name: nullroute-windows-x86_64
          path: dist/nullroute-*-windows-x86_64.zip
          if-no-files-found: error

  # Publish archives to a GitHub Release when a v* tag is pushed.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
